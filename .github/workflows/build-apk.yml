name: Compiler l'appli (téléphone + PC)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Tests du moteur de jeu
        run: dotnet test tests/ProjetSKE.Core.Tests/ProjetSKE.Core.Tests.csproj -c Release

      - name: Installer .NET MAUI (Android)
        run: dotnet workload install maui-android

      - name: Installer les dépendances Android
        run: >
          dotnet build src/ProjetSKE.App/ProjetSKE.App.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSdkLicenses=True

      - name: Vérifier le secret de signature
        env:
          SKE_KEYSTORE_PASS: ${{ secrets.SKE_KEYSTORE_PASS }}
        run: |
          if [ -z "$SKE_KEYSTORE_PASS" ]; then
            echo "::error::Secret SKE_KEYSTORE_PASS manquant : Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Compiler l'APK
        env:
          SKE_KEYSTORE_PASS: ${{ secrets.SKE_KEYSTORE_PASS }}
        run: >
          dotnet publish src/ProjetSKE.App/ProjetSKE.App.csproj
          -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=1.0.${{ github.run_number }}
          -p:SkeKeystorePass="$SKE_KEYSTORE_PASS"
          -o out

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjetSKE-apk
          path: out/*-Signed.apk
          if-no-files-found: error
          # L'APK durable est dans les Releases : l'artefact ne sert qu'aux jobs suivants.
          retention-days: 1

  # Lance l'APK sur un émulateur Android et parcourt le jeu automatiquement (Dev/AutoTest.cs)
  # pour détecter les plantages sans téléphone. Le journal Android est publié en artefact.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjetSKE-apk
          path: apk

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test automatique sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell am start -n com.laizu.projetske/com.laizu.projetske.MainActivity --ez autotest true
            for i in $(seq 1 48); do adb logcat -d | grep -q -E "SKE_AUTOTEST_DONE|SKE_AUTOTEST_FAIL" && break; sleep 5; done
            adb logcat -d > logcat.txt || true
            adb exec-out screencap -p > ecran.png || true
            grep -E " SKE |AndroidRuntime|FATAL EXCEPTION" logcat.txt | tail -400 || true
            grep -q "SKE_AUTOTEST_DONE" logcat.txt
            ! grep -q "SKE_SYNC_FAIL" logcat.txt

      - name: Publier le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulateur-journal
          path: |
            logcat.txt
            ecran.png
          if-no-files-found: ignore
          retention-days: 3

  # Appli PC (Windows) : le MÊME projet, compilé pour Windows, puis testé avec le même test automatique
  # (Dev/AutoTest.cs). Une version n'est publiée que si le téléphone ET le PC passent : les deux restent identiques.
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installer .NET MAUI (Windows)
        run: dotnet workload install maui-windows

      - name: Compiler l'appli PC
        run: >
          dotnet publish src/ProjetSKE.App/ProjetSKE.App.csproj
          -f net10.0-windows10.0.19041.0 -c Release
          -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=1.0.${{ github.run_number }}
          -o outwin

      - name: Test automatique sur PC
        shell: pwsh
        run: |
          $log = Join-Path $PWD "ske-log.txt"
          $env:SKE_LOG_FILE = $log
          $app = Start-Process -FilePath "outwin\ProjetSKE.App.exe" -ArgumentList "--autotest" -PassThru
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "SKE_AUTOTEST_DONE|SKE_AUTOTEST_FAIL" -Quiet)) { break }
            if ($app.HasExited) { "L'appli s'est fermée (code $($app.ExitCode))."; break }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          if (-not (Test-Path $log)) { "Aucun journal : l'appli n'a pas démarré."; exit 1 }
          Get-Content $log -Tail 400
          if (-not (Select-String -Path $log -Pattern "SKE_AUTOTEST_DONE" -Quiet)) { exit 1 }
          if (Select-String -Path $log -Pattern "SKE_SYNC_FAIL" -Quiet) { exit 1 }

      # Tout dans un seul dossier « ProjetSKE » : le lanceur « Projet SKE.exe » bien en vue, et le jeu (des centaines
      # de fichiers) rangé dans « fichiers ». Le lanceur est compilé avec le C# du .NET Framework intégré à Windows.
      - name: Préparer le .zip
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Path ProjetSKE | Out-Null
          Copy-Item -Path outwin -Destination ProjetSKE\fichiers -Recurse
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $icon = Get-ChildItem -Path outwin -Filter *.ico -Recurse | Select-Object -First 1
          $cscArgs = @("/nologo", "/target:winexe", "/optimize+", "/r:System.Windows.Forms.dll", "/r:System.Core.dll", "/out:ProjetSKE\Projet SKE.exe")
          if ($icon) { $cscArgs += "/win32icon:$($icon.FullName)" }
          $cscArgs += "tools\lanceur\Lanceur.cs"
          & $csc @cscArgs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "ProjetSKE\Projet SKE.exe")) { "Lanceur non compilé"; exit 1 }
          # Le lanceur doit démarrer le jeu : essai rapide (le jeu est fermé juste après).
          # (Pas de « -Wait » : PowerShell attendrait aussi le jeu lancé par le lanceur, qui ne se ferme jamais seul.)
          $before = @(Get-Process ProjetSKE.App -ErrorAction SilentlyContinue).Count
          $launcher = Start-Process -FilePath "ProjetSKE\Projet SKE.exe" -PassThru
          $null = $launcher.WaitForExit(20000)
          Start-Sleep -Seconds 8
          $game = Get-Process ProjetSKE.App -ErrorAction SilentlyContinue
          if (@($game).Count -le $before) { "Le lanceur n'a pas démarré le jeu"; exit 1 }
          $game | Stop-Process -Force
          Get-ChildItem ProjetSKE | Select-Object Name
          Compress-Archive -Path ProjetSKE -DestinationPath ProjetSKE-Windows.zip

      - name: Publier l'appli PC
        uses: actions/upload-artifact@v4
        with:
          name: ProjetSKE-windows
          path: ProjetSKE-Windows.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publier le journal PC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-journal
          path: ske-log.txt
          if-no-files-found: ignore
          retention-days: 3

  # Publie l'APK testé en « Release » GitHub : l'application la détecte et se met à jour toute seule (Updates.cs).
  # Le numéro de compilation sert d'étiquette (v123) et de versionCode Android.
  # Pas une version par push : seulement quand le message du commit contient « [maj] » (fin d'un lot de
  # changements), ou en lançant le workflow à la main (Actions › Compiler l'APK › Run workflow).
  release:
    needs: [build, emulator-test, windows]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[maj]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjetSKE-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: ProjetSKE-windows
          path: pc

      - name: Nommer l'APK
        run: mv apk/*.apk apk/ProjetSKE.apk

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Publication manuelle.' }}
          target_commitish: ${{ github.sha }}
          files: |
            apk/ProjetSKE.apk
            pc/ProjetSKE-Windows.zip
          make_latest: true
